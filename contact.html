<!DOCTYPE html>

<head>
    <meta charset="UTF-8">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">

<body>
    <header class="container bar">
        <img class="logo" src="images/logo.png" alt="GG News logo">
        <nav class="menu">
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="news.html">News</a>
            <a href="reviews.html">Reviews</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>
    <main class="container p-4">
        <h1>Contact Us</h1>
        <p>Send feedback about our gaming news and reviews.</p>
        <h2>Registration Form</h2>
        <form class="form" id="registerForm" novalidate>
            <label for="name">Name</label>
            <input class="form-control" type="text" id="name" required>
            <small id="nameFeedback" class="d-block"></small>
            <label for="email">Email</label>
            <input class="form-control" type="email" id="email" required>
            <small id="emailFeedback" class="d-block"></small>
            <label for="message">Message</label>
            <textarea class="form-control" id="message" rows="4" required></textarea>
            <small id="messageFeedback" class="d-block"></small>
            <label for="password">Password</label>
            <input class="form-control" type="password" id="password" required>
            <small id="passwordFeedback" class="d-block"></small>
            <small id="strength" class="d-block"></small>
            <label for="confirmPassword">Confirm Password</label>
            <input class="form-control" type="password" id="confirmPassword" required>
            <small id="confirmPasswordFeedback" class="d-block"></small>
            <button class="btn btn-primary mt-3" type="submit">Register</button>
            <p id="formStatus" class="mt-2"></p>
        </form>
    </main>

</body>
</html>
